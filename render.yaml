# ═══════════════════════════════════════════════════════════
# Render Deployment Config — Causal Paper Scout
#
# Service type: web (Free Web Service)
# Python: 3.11.9 — explicitly pinned. Render's default is now
#   Python 3.14 which has no pre-built wheels for scipy/numpy.
#   Also enforced via .python-version file in repo root.
# ═══════════════════════════════════════════════════════════

services:
  - type: web
    name: causal-paper-scout
    runtime: python
    repo: https://github.com/magic-emperor/causal-ensemble-brain
    branch: main
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements_scout.txt
    startCommand: python causal_paper_scout.py
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: causal-scout-db
          property: connectionString
      - key: PAPER_SCOUT_BRAIN
        value: causal_ensemble
      - key: PAPER_SCOUT_INTERVAL_MIN
        value: "55"
      - key: SCRAPER_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: BREEZE_API_KEY
        sync: false
      - key: BREEZE_SECRET
        sync: false
      - key: BREEZE_SESSION_TOKEN
        sync: false

databases:
  - name: causal-scout-db
    databaseName: causal_scout
    plan: free
    postgresMajorVersion: 16